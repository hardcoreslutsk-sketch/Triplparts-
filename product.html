<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRIPL PARTS — Część</title>
<meta name="theme-color" content="#18181b">
<script>
(function(){
  try{
    if (localStorage.getItem('tp-theme') === 'light') document.documentElement.setAttribute('data-theme','light');
    var l = localStorage.getItem('tp-lang'); if (l) document.documentElement.setAttribute('lang', l);
  }catch(e){}
})();
</script>
<link rel="stylesheet" href="styles.css?v=105">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js?v=105"></script>
<script src="i18n.js?v=105"></script>
<script src="translator.js?v=105"></script>
<script src="cart.js?v=105"></script>
<script defer src="product.js?v=105"></script>
</head>
<body>

<header class="site-header">
<div class="container header-inner">
<a class="brand" href="index.html"><span class="brand-name">TRIPL PARTS</span></a>
<nav class="header-nav">
<a href="index.html" data-i18n="nav.catalog">Katalog</a>
<a href="index.html#contact" data-i18n="nav.contact">Kontakt</a>
<a class="admin-link" href="admin.html" data-i18n="nav.admin">Panel administratora</a>
<div class="switchers">
  <div class="switcher">
    <button class="switcher-btn" type="button" data-switcher-toggle="lang" aria-expanded="false">
      <span data-current-lang>PL</span>
      <span class="caret">▼</span>
    </button>
    <div class="switcher-menu" data-switcher-menu="lang" hidden>
      <button type="button" data-lang-btn="pl">Polski</button>
      <button type="button" data-lang-btn="en">English</button>
      <button type="button" data-lang-btn="pt">Português</button>
    </div>
  </div>
  <div class="switcher">
    <button class="switcher-btn" type="button" data-switcher-toggle="currency" aria-expanded="false">
      <span data-current-currency>PLN</span>
      <span class="caret">▼</span>
    </button>
    <div class="switcher-menu" data-switcher-menu="currency" hidden>
      <button type="button" data-currency-btn="PLN">PLN — złoty</button>
      <button type="button" data-currency-btn="EUR">EUR — euro</button>
    </div>
  </div>
</div>
<a class="cart-link" href="checkout.html" aria-label="Koszyk">
<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"></path></svg>
<span id="cart-count" class="cart-count" hidden></span>
</a>
<button class="theme-toggle" id="theme-toggle" type="button" aria-label="Theme">
<span class="theme-icon-light" aria-hidden="true">☀</span>
<span class="theme-icon-dark" aria-hidden="true">☾</span>
</button>
</nav>
</div>
</header>

<main class="product-page-main">
<div class="container">
<nav class="breadcrumb" id="breadcrumb" hidden>
<a href="index.html" data-i18n="product.bcCatalog">Katalog</a>
<span class="bc-sep">/</span>
<span id="bc-category"></span>
<span class="bc-sep">/</span>
<span id="bc-name" class="bc-current"></span>
</nav>

<div id="product-loading" class="product-loading" data-i18n="product.loading">Ładowanie…</div>

<div id="product-not-found" class="product-not-found" hidden>
<h1 data-i18n="product.notFound">Nie znaleziono części</h1>
<p data-i18n="product.notFoundHint">Ten produkt został usunięty albo link jest nieprawidłowy.</p>
<a class="button button-primary" href="index.html" data-i18n="product.back">Wróć do katalogu</a>
</div>

<div id="product-content" hidden>
<div class="product-detail">
<section class="product-detail-gallery">
<div class="gallery-main"><img id="main-image" src="" alt=""></div>
<button class="gallery-nav prev" type="button" id="prev-image" aria-label="Prev">‹</button>
<button class="gallery-nav next" type="button" id="next-image" aria-label="Next">›</button>
<div class="gallery-thumbs" id="thumbs"></div>
</section>

<section class="product-detail-info">
<span class="product-category" id="p-category"></span>
<h1 id="p-name"></h1>
<div class="product-detail-status"><span class="stock-badge" id="p-status"></span></div>
<div class="product-detail-price" id="p-price"></div>
<div class="product-detail-actions">
<button class="button button-primary" id="buy-btn" type="button" data-i18n="product.buy">Kup</button>
<a class="button button-secondary" id="wa-btn" href="#" target="_blank" rel="noopener" data-i18n="product.wa">WhatsApp</a>
<a class="button button-secondary" id="phone-btn" href="#" data-i18n="product.call">Zadzwoń</a>
<a class="button button-secondary" id="email-btn" href="#" data-i18n="product.email">E-mail</a>
</div>
<button class="share-btn" type="button" id="share-btn">
<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><path d="M8.59 13.51l6.83 3.98M15.41 6.51L8.59 10.49"></path></svg>
<span data-i18n="product.shareBtn">Skopiuj link do tej części</span>
</button>
<div class="modal-section">
<h4 data-i18n="product.partInfo">Informacje o części</h4>
<dl id="part-info"></dl>
</div>
<p class="modal-desc" id="p-desc"></p>
</section>
</div>

<section class="product-detail-vehicle-wrap">
<h2 data-i18n="product.vehicle">Samochód dawca</h2>
<dl id="vehicle-info" class="vehicle-full-info"></dl>
</section>
</div>
</div>
</main>

<footer class="site-footer">
<div class="container footer-inner">
<a class="footer-brand" href="index.html">TRIPL PARTS</a>
<span data-i18n="footer.tagline">Używane części samochodowe</span>
<span>© <span id="current-year">2026</span> TRIPL PARTS</span>
</div>
</footer>

<div id="toast-wrap" class="toast-wrap" aria-live="polite"></div>

<script>
document.getElementById("current-year").textContent = new Date().getFullYear();
</script>
</body>
</html>
