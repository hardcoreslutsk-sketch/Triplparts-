<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRIPL PARTS — Moje zamówienia</title>
<meta name="theme-color" content="#18181b">
<script>
(function(){
  try{
    if (localStorage.getItem('tp-theme') === 'light') document.documentElement.setAttribute('data-theme','light');
    var l = localStorage.getItem('tp-lang'); if (l) document.documentElement.setAttribute('lang', l);
  }catch(e){}
})();
</script>
<link rel="stylesheet" href="styles.css?v=3001">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js?v=3001"></script>
<script src="i18n.js?v=3001"></script>
<script defer src="my-orders.js?v=3001"></script>
</head>
<body>

<header class="site-header">
  <div class="container header-top-row">
    <a class="brand" href="index.html"><span class="brand-name">TRIPL PARTS</span></a>
    <div class="header-actions">
      <a class="cart-link" href="checkout.html" aria-label="Koszyk">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"></path></svg>
        <span id="cart-count" class="cart-count" hidden></span>
      </a>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Theme">
        <span class="theme-icon-light" aria-hidden="true">☀</span>
        <span class="theme-icon-dark" aria-hidden="true">☾</span>
      </button>
    </div>
  </div>
  <div class="container header-bottom-row">
    <nav class="header-nav">
      <a href="index.html" data-i18n="nav.catalog">Katalog</a>
      <a href="index.html#contact" data-i18n="nav.contact">Kontakt</a>
      <a href="my-orders.html" data-i18n="nav.myOrders">Moje zamówienia</a>
      <a href="admin.html" data-i18n="nav.admin">Panel administratora</a>
    </nav>
    <div class="header-switchers">
      <div class="switcher">
        <button class="switcher-btn" type="button" data-switcher-toggle="lang" aria-expanded="false">
          <span data-current-lang>PL</span><span class="caret">▼</span>
        </button>
        <div class="switcher-menu" data-switcher-menu="lang" hidden>
          <button type="button" data-lang-btn="pl">Polski</button>
          <button type="button" data-lang-btn="en">English</button>
          <button type="button" data-lang-btn="pt">Português</button>
        </div>
      </div>
    </div>
  </div>
</header>

<main class="checkout-main">
<div class="container">

<div id="mo-login" class="checkout-form-wrap" style="max-width:520px;margin:0 auto;">
  <h1 data-i18n="myOrders.title">Moje zamówienia</h1>
  <p class="checkout-lead" data-i18n="myOrders.lead">Zaloguj się, aby zobaczyć historię zamówień.</p>
  <form id="mo-login-form" class="order-form">
    <div class="form-grid">
      <label class="full"><span data-i18n="myOrders.email">E-mail</span>
        <input id="mo-email" type="email" required autocomplete="email">
      </label>
      <label class="full"><span data-i18n="myOrders.password">Hasło</span>
        <input id="mo-password" type="password" required minlength="6" autocomplete="current-password">
      </label>
    </div>
    <p id="mo-login-msg" class="form-message"></p>
    <button type="submit" class="button button-primary checkout-submit" data-i18n="myOrders.login">Zaloguj się</button>
  </form>
</div>

<div id="mo-orders" hidden>
  <div class="admin-toolbar" style="margin-bottom:20px;">
    <div>
      <h2 data-i18n="myOrders.title">Moje zamówienia</h2>
      <p class="muted"><span data-i18n="myOrders.loggedAs">Zalogowany jako:</span> <b id="mo-user-email"></b></p>
    </div>
    <button type="button" class="admin-button secondary" id="mo-logout" data-i18n="myOrders.logout">Wyloguj</button>
  </div>
  <div id="mo-list" class="orders-list"></div>
  <div id="mo-empty" class="orders-empty" hidden>
    <h3 data-i18n="myOrders.noOrders">Nie masz jeszcze zamówień.</h3>
    <p><a href="index.html" data-i18n="myOrders.backToCatalog">Wróć do katalogu</a></p>
  </div>
</div>

</div>
</main>

<footer class="site-footer">
<div class="container footer-inner">
<a class="footer-brand" href="index.html">TRIPL PARTS</a>
<span data-i18n="footer.tagline">Używane części samochodowe</span>
<span>© <span id="current-year">2026</span> TRIPL PARTS</span>
</div>
</footer>

<script>
document.getElementById("current-year").textContent = new Date().getFullYear();
</script>
</body>
</html>
